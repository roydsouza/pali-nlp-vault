<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <!-- Background Gradient: Deep Night Indigo to Midnight Navy -->
    <linearGradient id="bgPali" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a1a"/>
      <stop offset="45%" stop-color="#0c122c"/>
      <stop offset="100%" stop-color="#191538"/>
    </linearGradient>

    <!-- Title Gradient: Rich Saffron Amber to Radiant Warm Gold -->
    <linearGradient id="titlePali" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>

    <!-- Manuscript / Card Fill Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141a38"/>
      <stop offset="100%" stop-color="#0e1329"/>
    </linearGradient>

    <!-- Radial Saffron Aura / Glow -->
    <radialGradient id="glowSaffron" cx="88%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.32"/>
      <stop offset="50%" stop-color="#92400e" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#070a1a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="1200" height="360" rx="20" fill="url(#bgPali)"/>
  <rect x="2" y="2" width="1196" height="356" rx="18" fill="none" stroke="#d97706" stroke-opacity="0.38" stroke-width="2"/>
  <rect x="0" y="0" width="1200" height="360" rx="20" fill="url(#glowSaffron)"/>

  <!-- Left Accent Chip: Category / Domain Badge -->
  <g transform="translate(60, 36)">
    <rect x="0" y="0" width="310" height="32" rx="8" fill="#1e1b4b" stroke="#f59e0b" stroke-width="1.4" stroke-opacity="0.75"/>
    <circle cx="16" cy="16" r="4.5" fill="#fbbf24"/>
    <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#fde68a" letter-spacing="1.2">CANONICAL PĀḶI COMPUTATION</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="60" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="900" fill="url(#titlePali)" letter-spacing="0.5">Pali NLP</text>
  <text x="62" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="23" font-weight="600" fill="#fef08a">Learning to read the Buddha&#39;s own words</text>
  <text x="62" y="194" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#cbd5e1">Morphological parsing, DPD lemmatization &amp; interlinear scaffolding grounded in the canon.</text>

  <!-- Palm-leaf Manuscript Interlinear Demonstration Box (Sandhi Decomposition) -->
  <g transform="translate(62, 222)">
    <!-- Container Card -->
    <rect x="0" y="0" width="810" height="106" rx="12" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.45"/>

    <!-- Left: Merged Canonical Form (Manuscript Script) -->
    <g transform="translate(24, 18)">
      <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#94a3b8" letter-spacing="0.8">CANONICAL COMPOUND</text>
      <!-- Merged text -->
      <rect x="0" y="24" width="168" height="42" rx="8" fill="#1e293b" fill-opacity="0.7" stroke="#475569" stroke-width="1"/>
      <text x="84" y="52" text-anchor="middle" font-family="'Palatino', 'Baskerville', 'Times New Roman', serif" font-size="22" font-weight="700" fill="#f8fafc" letter-spacing="0.5">tathāgatopi</text>
    </g>

    <!-- Transition Arrow & Label -->
    <g transform="translate(210, 48)">
      <path d="M4,18 L32,18 M24,11 L32,18 L24,25" fill="none" stroke="#f59e0b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="18" y="4" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#fbbf24">SANDHI SPLIT</text>
    </g>

    <!-- Center Word 1: tathāgato (Lemma + Gloss) -->
    <g transform="translate(265, 16)">
      <rect x="0" y="0" width="175" height="74" rx="8" fill="#0f172a" stroke="#d97706" stroke-width="1.2"/>
      <text x="87" y="28" text-anchor="middle" font-family="'Palatino', 'Baskerville', 'Times New Roman', serif" font-size="22" font-weight="700" fill="#fbbf24">tathāgato</text>
      <line x1="14" y1="38" x2="161" y2="38" stroke="#334155" stroke-width="1"/>
      <text x="87" y="52" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#38bdf8">tathāgata · masc nom sg</text>
      <text x="87" y="66" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500" fill="#94a3b8">&quot;the Realized One&quot;</text>
    </g>

    <!-- Mathematical Plus Symbol -->
    <text x="454" y="60" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#f59e0b">+</text>

    <!-- Center Word 2: api (Particle + Gloss) -->
    <g transform="translate(470, 16)">
      <rect x="0" y="0" width="135" height="74" rx="8" fill="#0f172a" stroke="#d97706" stroke-width="1.2"/>
      <text x="67" y="28" text-anchor="middle" font-family="'Palatino', 'Baskerville', 'Times New Roman', serif" font-size="22" font-weight="700" fill="#fbbf24">api</text>
      <line x1="12" y1="38" x2="123" y2="38" stroke="#334155" stroke-width="1"/>
      <text x="67" y="52" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#38bdf8">indecl · particle</text>
      <text x="67" y="66" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500" fill="#94a3b8">&quot;even, also&quot;</text>
    </g>

    <!-- Right English Translation Badge -->
    <g transform="translate(622, 16)">
      <rect x="0" y="0" width="168" height="74" rx="8" fill="#1e1b4b" fill-opacity="0.65" stroke="#818cf8" stroke-width="1" stroke-opacity="0.4"/>
      <text x="84" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#a5b4fc" letter-spacing="0.5">SYNTHESIS</text>
      <text x="84" y="46" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#f1f5f9">&quot;Even the</text>
      <text x="84" y="64" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#f1f5f9">Realized One&quot;</text>
    </g>
  </g>

  <!-- Right Graphic Motif: Eight-Spoked Dhamma Wheel (Dhammacakka) Luminous Emblem -->
  <g transform="translate(1040, 180)" opacity="0.82">
    <!-- Outer Glow Rings -->
    <circle cx="0" cy="0" r="118" fill="none" stroke="#d97706" stroke-width="1.2" stroke-opacity="0.25" stroke-dasharray="4 6"/>
    <circle cx="0" cy="0" r="102" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-opacity="0.75"/>
    <circle cx="0" cy="0" r="88" fill="none" stroke="#fbbf24" stroke-width="1.2" stroke-opacity="0.5"/>

    <!-- 8 Rim Studs -->
    <circle cx="0" cy="-95" r="3.5" fill="#fde68a"/>
    <circle cx="67" cy="-67" r="3.5" fill="#fde68a"/>
    <circle cx="95" cy="0" r="3.5" fill="#fde68a"/>
    <circle cx="67" cy="67" r="3.5" fill="#fde68a"/>
    <circle cx="0" cy="95" r="3.5" fill="#fde68a"/>
    <circle cx="-67" cy="67" r="3.5" fill="#fde68a"/>
    <circle cx="-95" cy="0" r="3.5" fill="#fde68a"/>
    <circle cx="-67" cy="-67" r="3.5" fill="#fde68a"/>

    <!-- 8 Spokes (Noble Eightfold Path) -->
    <!-- Spoke 1 (Vertical up) -->
    <line x1="0" y1="-28" x2="0" y2="-88" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Spoke 2 (Top-Right) -->
    <line x1="20" y1="-20" x2="62" y2="-62" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Spoke 3 (Horizontal Right) -->
    <line x1="28" y1="0" x2="88" y2="0" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Spoke 4 (Bottom-Right) -->
    <line x1="20" y1="20" x2="62" y2="62" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Spoke 5 (Vertical down) -->
    <line x1="0" y1="28" x2="0" y2="88" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Spoke 6 (Bottom-Left) -->
    <line x1="-20" y1="20" x2="-62" y2="62" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Spoke 7 (Horizontal Left) -->
    <line x1="-28" y1="0" x2="-88" y2="0" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Spoke 8 (Top-Left) -->
    <line x1="-20" y1="-20" x2="-62" y2="-62" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Central Hub & Core Jewel -->
    <circle cx="0" cy="0" r="28" fill="#1e1838" stroke="#fbbf24" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="14" fill="#d97706" stroke="#fef08a" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="5" fill="#fef08a"/>
  </g>
</svg>
